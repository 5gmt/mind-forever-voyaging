name: Artifact maintenance

on:
  push:
    branches: [codex/modern-amfv]
    paths:
      - .github/artifact-cleanup-2026-11-07.json
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete only the exact artifacts in the reviewed cleanup manifest'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: artifact-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/codex/modern-amfv'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout reviewed default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Clean up the reviewed artifact IDs
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_CLEANUP: ${{ github.event_name == 'push' || inputs.apply }}
        run: |
          if [[ "$APPLY_CLEANUP" == 'true' ]]; then
            node scripts/cleanup-actions-artifacts.mjs --apply
          else
            node scripts/cleanup-actions-artifacts.mjs
          fi

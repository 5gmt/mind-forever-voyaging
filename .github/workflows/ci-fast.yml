name: CI fast

on:
  pull_request:
    branches:
      - codex/modern-amfv
  push:
    branches:
      - codex/modern-amfv

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate workflows
        run: bash scripts/lint-workflows.sh

      - name: Test CI policy
        run: node --test tests/ci/*.test.mjs

      - name: Classify the complete change
        id: scope
        run: node scripts/ci-scope.mjs

  verify:
    needs: changes
    if: needs.changes.outputs.scope != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up npm
        run: bash scripts/bootstrap-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical story artifact
        shell: bash
        run: |
          echo "14e2fd1872c9487e2ca51a7975590358f5ca42a4b439abc39c60b6653511216d  public/amfv-r79-s851122.z4" | sha256sum --check --strict

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Check complete browser test partition
        run: node scripts/ci-e2e.mjs --check

  ci-fast-gate:
    if: always()
    needs: [changes, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check fast results and report Full requirement
        env:
          CI_MODE: fast
          CI_SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          E2E_RESULT: skipped
        run: node scripts/ci-scope.mjs gate

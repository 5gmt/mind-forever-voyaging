name: CI

on:
  pull_request:
    branches:
      - codex/modern-amfv
  push:
    branches:
      - codex/modern-amfv

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical story artifact
        shell: bash
        run: |
          echo "14e2fd1872c9487e2ca51a7975590358f5ca42a4b439abc39c60b6653511216d  public/amfv-r79-s851122.z4" | sha256sum --check --strict

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
